# Server block for nginxinc/nginx-unprivileged, installed as /etc/nginx/conf.d/default.conf.
# The image's own nginx.conf already runs as non-root and keeps the pid and temp files in /tmp.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;

    server_tokens      off;
    # Relative Location headers: behind the gateway, nginx's own scheme and port (http, 8080) are wrong.
    absolute_redirect  off;
    gzip               on;
    gzip_vary          on;
    gzip_types         text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Security headers (CSP and friends) are set by the cluster's gateway.

    error_page 404 /index.html;

    # Pages from before the site became a single page.
    location = /about    { return 301 /#home; }
    location = /projects { return 301 /#projects; }
    location = /contact  { return 301 /#contact; }

    # Vite's fingerprinted output (build.assetsDir): the name changes with the content, so cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
    }
}
