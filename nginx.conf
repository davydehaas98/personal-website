# Full nginx main config for nginxinc/nginx-unprivileged.
# Runs as non-root on 8080 and only writes to /tmp, so it works with a read-only root filesystem.
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    # Send relative Location headers: behind the ingress, nginx's own scheme/port (http, 8080) are wrong.
    absolute_redirect  off;

    gzip               on;
    gzip_vary          on;
    gzip_types         text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;
        root         /usr/share/nginx/html;

        # Unknown paths get the home page with a 404 status.
        error_page 404 /index.html;

        # Pages that existed before the site became a single page.
        location = /about    { return 301 /#home; }
        location = /projects { return 301 /#projects; }
        location = /contact  { return 301 /#contact; }

        # Vite's fingerprinted build output (build.assetsDir): the name changes with the content, so cache forever.
        location /static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        # Everything else (index.html, images in public/): always revalidate.
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
