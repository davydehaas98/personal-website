name: Release
# Every push to main releases a new version; Actions > Release > Run workflow does the same by hand.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'renovate.json'
      - '.github/workflows/build.yaml'
      - '.github/workflows/test.yaml'
  workflow_dispatch:

# One release at a time, so two runs never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    # The button lets you pick a branch; only main is released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Test and lint
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint

      # Calendar version YYYY.M.N: year, month without a leading zero (keeps it valid semver), Nth release that month.
      - name: Pick version
        id: version
        run: |
          month="$(date -u +%Y).$(date -u +%-m)"
          last="$(git tag --list "${month}.*" | sed "s/^${month}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)"
          version="${month}.$(( ${last:--1} + 1 ))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the exact version: tags never move, so Git (and Renovate) always says which image runs.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push to registry
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushed with GITHUB_TOKEN, so the tag does not start another workflow run.
      - name: Tag the release in git
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
