name: Daily test
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  lighthouse-check:
    name: Lighthouse check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true

      # Three runs against the live site, judged on the median one (.github/lighthouserc.json), so one slow runner
      # doesn't fail the check. Uses the runner's Chrome.
      - name: Lighthouse check
        run: |
          pnpm install --frozen-lockfile
          pnpm lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report

  zap-scan:
    name: ZAP scan
    runs-on: ubuntu-latest
    # Keeps one "ZAP Scan Baseline Report" issue up to date with the findings, instead of only an artifact.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: ZAP scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: https://davydehaas.nl/
          cmd_options: -a

  k6-load-test:
    name: k6 load test
    # After the other checks, so the load doesn't skew their results, but also when they failed.
    needs: [lighthouse-check, zap-scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up k6
        uses: grafana/setup-k6-action@v1.3.0
      - name: k6 load test
        uses: grafana/run-k6-action@v1.6.0
        with:
          path: load-test.js
          flags: --out json=results.json
      - name: Upload k6 load test results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k6-results
          path: results.json
