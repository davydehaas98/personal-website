name: Build
on:
  push:
    branches:
      - main
    # These can't break the site or change the image.
    paths-ignore:
      - '**.md'
      - 'renovate.json'
      - '.github/workflows/test.yaml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Calendar version YYYY.M.N: year, month without a leading zero (keeps it valid semver), Nth release that month.
      - name: Pick version
        id: version
        run: |
          month="$(date -u +%Y).$(date -u +%-m)"
          last="$(git tag --list "${month}.*" | sed "s/^${month}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)"
          version="${month}.$(( ${last:--1} + 1 ))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push to registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$OWNER" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$SOURCE" .

      # Pushed with GITHUB_TOKEN, so the tag does not start another workflow run.
      - name: Tag the release in git
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
