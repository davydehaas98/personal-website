# Included in every nginx location (add_header in a location replaces the server-level ones).
# Same CSP as the cluster: the build has no inline scripts or styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
